# In dev, Vite's own dev server proxies /api -> localhost:8080 (see
# vite.config.js). There is no Vite dev server in the built/production
# image, so nginx has to do that same job here instead.
server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
