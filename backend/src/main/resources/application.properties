spring.application.name=setu-backend
server.port=8080
model.service.base-url=${MODEL_SERVICE_URL:http://localhost:8000}

# Defaults match the local docker-compose Postgres. Override DATASOURCE_URL
# (e.g. to jdbc:postgresql://<rds-endpoint>:5432/setu, or to
# jdbc:postgresql://postgres:5432/setu when Spring Boot itself also runs
# inside the same docker-compose network) without touching code.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/setu}
spring.datasource.username=${DATASOURCE_USERNAME:setu}
spring.datasource.password=${POSTGRES_PASSWORD:setu_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Opt-in API-key auth (see config/ApiKeyFilter.java) -- blank means disabled,
# so local/Codespace testing is unaffected unless this is explicitly set.
app.api-key=${APP_API_KEY:}
