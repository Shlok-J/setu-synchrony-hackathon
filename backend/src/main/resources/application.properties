spring.application.name=setu-backend
server.port=8080
model.service.base-url=${MODEL_SERVICE_URL:http://localhost:8000}

# defaults to the local docker-compose Postgres; override DATASOURCE_URL for RDS etc.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/setu}
spring.datasource.username=${DATASOURCE_USERNAME:setu}
spring.datasource.password=${POSTGRES_PASSWORD:setu_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# blank = auth disabled, so local testing works without setting a key
app.api-key=${APP_API_KEY:}
