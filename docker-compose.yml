services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: setu
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
    ports:
      - "5432:5432"  # needed for local dev when backend runs outside Docker
    volumes:
      - setu_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  model-service:
    build:
      context: .
      dockerfile: model-service/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: setu
      PGUSER: setu
      PGPASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - model-service
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/setu
      DATASOURCE_USERNAME: setu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
      MODEL_SERVICE_URL: http://model-service:8000
      APP_API_KEY: ${APP_API_KEY:-}

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  setu_pgdata:
